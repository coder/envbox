apiVersion: v1
kind: Pod
metadata:
  name: nested-virt-probe
spec:
  nodeSelector:
    workload: nested-virt
  tolerations:
    - key: workload
      operator: Equal
      value: nested-virt
      effect: NoSchedule
  containers:
    - name: probe
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -ux
          echo 'CPU virtualization flags:'
          grep -Eo 'vmx|svm' /proc/cpuinfo | sort -u || true
          echo
          echo '/dev/kvm:'
          ls -l /dev/kvm || true
          echo
          echo '/dev/net/tun:'
          ls -l /dev/net/tun || true
          sleep 3600
