apiVersion: v1
kind: Pod
metadata:
  name: nested-virt-cpu-probe
spec:
  restartPolicy: Never
  nodeName: REPLACE_WITH_NODE_NAME
  tolerations:
    - operator: Exists
  containers:
    - name: probe
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -eux
          echo '--- CPU virtualization flags ---'
          grep -Eo 'vmx|svm' /proc/cpuinfo | sort -u || true
          echo '--- /dev/kvm ---'
          ls -l /dev/kvm || true
          echo '--- /dev/net/tun ---'
          ls -l /dev/net/tun || true
          sleep 30
