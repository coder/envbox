apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-userns-prep
  namespace: userns-rootful-dind-auto
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-userns-prep-experiment
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-userns-prep-experiment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-userns-prep-experiment
subjects:
  - kind: ServiceAccount
    name: node-userns-prep
    namespace: userns-rootful-dind-auto
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-userns-prep-source
  namespace: userns-rootful-dind-auto
data:
  main.go: |
    package main

    import (
      "bytes"
      "crypto/tls"
      "crypto/x509"
      "encoding/json"
      "fmt"
      "io"
      "net/http"
      "os"
      "strings"
      "time"
    )

    const (
      sysctlPath = "/host-sysctl/max_user_namespaces"
      targetSourcePath = "/proc/sys/user/max_mnt_namespaces"
      startupTaintKey = "experiment.coder.com/userns-prep"
    )

    type taint struct {
      Key string `json:"key"`
      Value string `json:"value,omitempty"`
      Effect string `json:"effect"`
      TimeAdded *string `json:"timeAdded,omitempty"`
    }

    type node struct {
      Spec struct {
        Taints []taint `json:"taints,omitempty"`
      } `json:"spec"`
    }

    func main() {
      nodeName := mustEnv("NODE_NAME")
      target := strings.TrimSpace(readFile(targetSourcePath))
      before := strings.TrimSpace(readFile(sysctlPath))
      fmt.Printf("node=%s %s before=%s target=%s\n", nodeName, sysctlPath, before, target)

      must(os.WriteFile(sysctlPath, []byte(target+"\n"), 0o644))
      after := strings.TrimSpace(readFile(sysctlPath))
      if after != target {
        panic(fmt.Sprintf("sysctl verification failed: got %q, want %q", after, target))
      }

      client := kubernetesClient()
      current := getNode(client, nodeName)
      filtered := make([]taint, 0, len(current.Spec.Taints))
      found := false
      for _, item := range current.Spec.Taints {
        if item.Key == startupTaintKey {
          found = true
          continue
        }
        filtered = append(filtered, item)
      }
      if !found {
        panic("startup taint was not present; refusing to publish readiness")
      }

      patch := []map[string]any{
        {"op": "test", "path": "/spec/taints", "value": current.Spec.Taints},
        {"op": "replace", "path": "/spec/taints", "value": filtered},
        {"op": "add", "path": "/metadata/labels/experiment.coder.com~1userns-ready", "value": "true"},
      }
      patchNode(client, nodeName, patch)
      fmt.Printf("verified %s=%s; labeled node ready and removed %s\n", sysctlPath, after, startupTaintKey)
      must(os.WriteFile("/tmp/userns-prep-ready", []byte("ready\n"), 0o644))

      for {
        time.Sleep(30 * time.Second)
        observed := strings.TrimSpace(readFile(sysctlPath))
        if observed != target {
          panic(fmt.Sprintf("sysctl changed after readiness: got %q, want %q", observed, target))
        }
      }
    }

    func kubernetesClient() *http.Client {
      ca, err := os.ReadFile("/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
      must(err)
      pool, err := systemCertPool(ca)
      must(err)
      return &http.Client{Transport: &http.Transport{TLSClientConfig: &tls.Config{RootCAs: pool}}}
    }

    func systemCertPool(ca []byte) (*x509.CertPool, error) {
      pool, err := x509.SystemCertPool()
      if err != nil || pool == nil {
        pool = x509.NewCertPool()
      }
      if !pool.AppendCertsFromPEM(ca) {
        return nil, fmt.Errorf("append Kubernetes CA certificate")
      }
      return pool, nil
    }

    func getNode(client *http.Client, name string) node {
      var result node
      request(client, http.MethodGet, "/api/v1/nodes/"+name, nil, "", &result)
      return result
    }

    func patchNode(client *http.Client, name string, patch any) {
      body, err := json.Marshal(patch)
      must(err)
      request(client, http.MethodPatch, "/api/v1/nodes/"+name, body, "application/json-patch+json", nil)
    }

    func request(client *http.Client, method, path string, body []byte, contentType string, out any) {
      host := mustEnv("KUBERNETES_SERVICE_HOST")
      port := mustEnv("KUBERNETES_SERVICE_PORT_HTTPS")
      token := strings.TrimSpace(readFile("/var/run/secrets/kubernetes.io/serviceaccount/token"))
      req, err := http.NewRequest(method, "https://"+host+":"+port+path, bytes.NewReader(body))
      must(err)
      req.Header.Set("Authorization", "Bearer "+token)
      if contentType != "" {
        req.Header.Set("Content-Type", contentType)
      }
      response, err := client.Do(req)
      must(err)
      defer response.Body.Close()
      responseBody, err := io.ReadAll(response.Body)
      must(err)
      if response.StatusCode < 200 || response.StatusCode >= 300 {
        panic(fmt.Sprintf("Kubernetes API %s %s: %s: %s", method, path, response.Status, responseBody))
      }
      if out != nil {
        must(json.Unmarshal(responseBody, out))
      }
    }

    func mustEnv(name string) string {
      value := os.Getenv(name)
      if value == "" {
        panic("missing environment variable " + name)
      }
      return value
    }

    func readFile(path string) string {
      value, err := os.ReadFile(path)
      must(err)
      return string(value)
    }

    func must(err error) {
      if err != nil {
        panic(err)
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-userns-prep
  namespace: userns-rootful-dind-auto
spec:
  selector:
    matchLabels:
      app: node-userns-prep
  template:
    metadata:
      labels:
        app: node-userns-prep
    spec:
      serviceAccountName: node-userns-prep
      hostUsers: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        experiment.coder.com/userns-dind-auto-prepped: "true"
      tolerations:
        - key: experiment.coder.com/userns-dind-auto
          value: "true"
          effect: NoSchedule
        - key: experiment.coder.com/userns-prep
          value: required
          effect: NoSchedule
      containers:
        - name: prep
          image: public.ecr.aws/docker/library/golang:1.24-alpine
          imagePullPolicy: IfNotPresent
          command: ["go", "run", "/source/main.go"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/userns-prep-ready"]
            periodSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: max-user-namespaces
              mountPath: /host-sysctl/max_user_namespaces
      volumes:
        - name: source
          configMap:
            name: node-userns-prep-source
        - name: max-user-namespaces
          hostPath:
            path: /proc/sys/user/max_user_namespaces
            type: File
