apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: direct-sysbox-al2023-mng-135
  region: us-east-2
  version: "1.35"

autoModeConfig:
  enabled: false

managedNodeGroups:
  - name: direct-sysbox
    amiFamily: AmazonLinux2023
    instanceType: m6i.large
    minSize: 1
    desiredCapacity: 1
    maxSize: 2
    labels:
      experiment.coder.com/direct-sysbox: "true"
      sysbox-install: "yes"
    iam:
      withAddonPolicies:
        ebs: true

addons:
  - name: aws-ebs-csi-driver
