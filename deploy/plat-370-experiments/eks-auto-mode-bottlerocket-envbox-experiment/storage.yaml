apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: envbox-auto-gp3
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: envbox-workspace
  namespace: envbox-auto
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: envbox-auto-gp3
  resources:
    requests:
      storage: 30Gi
