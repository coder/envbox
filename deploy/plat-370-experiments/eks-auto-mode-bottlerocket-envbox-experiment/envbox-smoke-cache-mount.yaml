apiVersion: v1
kind: Pod
metadata:
  name: envbox-smoke
  namespace: envbox-auto
  labels:
    app.kubernetes.io/name: envbox-smoke
    experiment.coder.com/role: workspace
    experiment.coder.com/cache-mount: outer-only
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 300
  nodeSelector:
    experiment.coder.com/envbox-auto: "true"
  tolerations:
    - key: experiment.coder.com/envbox-auto
      operator: Equal
      value: "true"
      effect: NoSchedule
  initContainers:
    - name: initialize-workspace-volume
      image: public.ecr.aws/docker/library/alpine:3.21
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - |
          mkdir -p \
            /workspace-volume/home \
            /workspace-volume/cache/docker \
            /workspace-volume/cache/containers \
            /workspace-volume/envbox/containers \
            /workspace-volume/envbox/docker
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      volumeMounts:
        - name: workspace
          mountPath: /workspace-volume
  containers:
    - name: envbox
      image: ghcr.io/coder/envbox:0.6.7
      imagePullPolicy: Always
      command: ["/envbox", "docker"]
      env:
        - name: CODER_INNER_IMAGE
          value: us-docker.pkg.dev/coder-v2-images-public/public/envbox/enterprise-base:ubuntu
        - name: CODER_INNER_USERNAME
          value: coder
        - name: CODER_INNER_HOSTNAME
          value: envbox-smoke
        - name: CODER_MOUNTS
          value: /home/coder:/home/coder
        - name: CODER_CPUS
          value: "1"
        - name: CODER_MEMORY
          value: "4294967296"
        - name: CODER_DEBUG
          value: "true"
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        seccompProfile:
          type: Unconfined
      resources:
        requests:
          cpu: "1"
          memory: 3Gi
        limits:
          cpu: "2"
          memory: 7Gi
      volumeMounts:
        - name: workspace
          mountPath: /home/coder
          subPath: home
        - name: workspace
          mountPath: /var/lib/coder/docker
          subPath: cache/docker
        - name: workspace
          mountPath: /var/lib/coder/containers
          subPath: cache/containers
        - name: sysbox
          mountPath: /var/lib/sysbox
        - name: workspace
          mountPath: /var/lib/containers
          subPath: envbox/containers
        - name: workspace
          mountPath: /var/lib/docker
          subPath: envbox/docker
        - name: usr-src
          mountPath: /usr/src
          readOnly: true
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: cache
          mountPath: /cache
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: envbox-workspace
    - name: sysbox
      emptyDir: {}
    - name: usr-src
      hostPath:
        path: /usr/src
        type: ""
    - name: lib-modules
      hostPath:
        path: /lib/modules
        type: ""
    - name: cache
      hostPath:
        path: /var/lib/envbox-image-cache
        type: DirectoryOrCreate
