apiVersion: v1
kind: Pod
metadata:
  name: envbox-cache-probe-b
  namespace: envbox-auto
  labels:
    app.kubernetes.io/name: envbox-cache-probe
    experiment.coder.com/probe: b
spec:
  restartPolicy: Never
  nodeSelector:
    experiment.coder.com/envbox-auto: "true"
  tolerations:
    - key: experiment.coder.com/envbox-auto
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: probe
      image: public.ecr.aws/docker/library/alpine:3.21
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
        - |
          marker=/cache/share-probe

          echo "SELinux:"
          cat /proc/self/attr/current
          echo "Cache mount:"
          grep " /cache " /proc/self/mountinfo
          echo "Cache ownership:"
          ls -ldn /cache

          value="$(cat "$marker")"
          test "$value" = probe-a-v1
          echo "probe-b-observed=$value"

          temporary="$(mktemp /cache/.probe-b.XXXXXX)"
          trap 'rm -f "$temporary"' EXIT
          printf '%s\n' probe-b-v1 > "$temporary"
          sync
          mv "$temporary" "$marker"
          sync
          trap - EXIT

          value="$(cat "$marker")"
          test "$value" = probe-b-v1
          echo "probe-b-published=$value"
          stat -c 'marker-mode=%a marker-uid=%u marker-gid=%g marker-size=%s' "$marker"
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        privileged: true
        allowPrivilegeEscalation: true
        seccompProfile:
          type: Unconfined
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      volumeMounts:
        - name: cache
          mountPath: /cache
  volumes:
    - name: cache
      hostPath:
        path: /var/lib/envbox-image-cache
        type: DirectoryOrCreate
