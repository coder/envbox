apiVersion: v1
kind: Pod
metadata:
  name: nested-virt-firecracker-smoke
spec:
  restartPolicy: Never
  nodeSelector:
    coder.com/kvm: "true"
  tolerations:
    - key: workload
      operator: Equal
      value: nested-virt
      effect: NoSchedule
  containers:
    - name: firecracker
      image: 849808308023.dkr.ecr.us-east-2.amazonaws.com/nested-virt-firecracker-smoke:test-2
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          devices.coder.com/kvm: "1"
          cpu: "1"
          memory: 256Mi
        limits:
          devices.coder.com/kvm: "1"
          cpu: "1"
          memory: 512Mi
