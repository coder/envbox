apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Pod
    metadata:
      name: nested-virt-firecracker-concurrent-a
    spec:
      restartPolicy: Never
      nodeSelector:
        coder.com/kvm: "true"
      tolerations:
        - key: workload
          operator: Equal
          value: nested-virt
          effect: NoSchedule
      containers:
        - name: firecracker
          image: REPLACE_WITH_FIRECRACKER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              devices.coder.com/kvm: "1"
              cpu: "1"
              memory: 256Mi
            limits:
              devices.coder.com/kvm: "1"
              cpu: "1"
              memory: 512Mi
  - apiVersion: v1
    kind: Pod
    metadata:
      name: nested-virt-firecracker-concurrent-b
    spec:
      restartPolicy: Never
      nodeSelector:
        coder.com/kvm: "true"
      tolerations:
        - key: workload
          operator: Equal
          value: nested-virt
          effect: NoSchedule
      containers:
        - name: firecracker
          image: REPLACE_WITH_FIRECRACKER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              devices.coder.com/kvm: "1"
              cpu: "1"
              memory: 256Mi
            limits:
              devices.coder.com/kvm: "1"
              cpu: "1"
              memory: 512Mi
