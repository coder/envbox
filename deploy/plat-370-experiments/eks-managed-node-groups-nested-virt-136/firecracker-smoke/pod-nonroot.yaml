apiVersion: v1
kind: Pod
metadata:
  name: nested-virt-firecracker-nonroot
spec:
  restartPolicy: Never
  nodeSelector:
    coder.com/kvm: "true"
  tolerations:
    - key: workload
      operator: Equal
      value: nested-virt
      effect: NoSchedule
  containers:
    - name: firecracker
      image: REPLACE_WITH_FIRECRACKER_IMAGE
      env:
        - name: FIRECRACKER_COPY_ROOTFS
          value: "true"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          devices.coder.com/kvm: "1"
          cpu: "1"
          memory: 256Mi
        limits:
          devices.coder.com/kvm: "1"
          cpu: "1"
          memory: 512Mi
