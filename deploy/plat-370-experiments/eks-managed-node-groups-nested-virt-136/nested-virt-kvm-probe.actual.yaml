apiVersion: v1
kind: Pod
metadata:
  name: nested-virt-kvm-probe
spec:
  restartPolicy: Never
  nodeName: ip-192-168-78-100.us-east-2.compute.internal
  containers:
    - name: probe
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -eux
          ls -l /dev/kvm
          exec 3<> /dev/kvm
          echo 'opened /dev/kvm read/write'
          exec 3>&-
      securityContext:
        privileged: true
      volumeMounts:
        - name: kvm
          mountPath: /dev/kvm
  volumes:
    - name: kvm
      hostPath:
        path: /dev/kvm
        type: CharDevice
